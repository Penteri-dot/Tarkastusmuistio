<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14293B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarkastus">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; font-src 'none'; frame-src 'none'; form-action 'none'">
<title>Tarkastusmuistio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#E9ECEB;--sf:#fff;--sf2:#F3F5F4;--ink:#182225;--soft:#58645F;--line:#D3D8D5;--navy:#14293B;--navy2:#1E3A52;--or:#E2600C;--ok:#1F7A4D;--warn:#B26A00;--bad:#C62A2A;--r:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--head:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",var(--font)}
@media (prefers-color-scheme:dark){:root{--bg:#121719;--sf:#1C2326;--sf2:#242C2F;--ink:#ECEFED;--soft:#9BA7A3;--line:#344043;--navy2:#86AFD0}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#14293B;color:#F2F5F4;padding-top:env(safe-area-inset-top);box-shadow:0 2px 10px rgba(0,0,0,.2)}
.top-in{padding:12px 16px 4px}.brand-row{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--head);font-weight:800;font-size:21px;letter-spacing:.3px}.brand span{color:#F0B31C;font-size:.68em;margin-left:6px}
.help{background:none;color:#E6ECEE;border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:3px 11px;font-size:12.5px;font-weight:700}
.addr{font-size:13px;margin-top:6px;font-weight:600;color:#E6ECEE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:rgba(255,255,255,.12);border-radius:10px;padding:1px 8px;font-size:11.5px;margin-right:4px}
.tabs{display:flex;gap:6px;padding:8px 16px 12px}.tab{flex:1;padding:9px 2px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#C9D3D8;font-weight:600;font-size:13px}
.tab.on{background:var(--or);border-color:var(--or);color:#fff}
main{padding:14px 12px calc(120px + env(safe-area-inset-bottom))}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}.card.nopad{padding:0;overflow:hidden}.padx{padding:14px 14px 4px}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}.sh h3,.mh{font-family:var(--head);font-size:19px;margin:0;font-weight:700}.num{font-family:var(--head);font-weight:800;font-size:19px;color:var(--navy2)}
.mh{margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.fi.full{grid-column:1/-1}
.fi label,.lbl{display:block;font-size:11px;color:var(--soft);font-weight:700;margin:0 0 4px;letter-spacing:.2px}.lbl{margin-top:12px}
input,textarea{width:100%;background:var(--sf2);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px 10px;font-size:16px;font-family:inherit}
textarea{resize:vertical;line-height:1.45;margin-top:4px}input:focus,textarea:focus{outline:2px solid var(--or);outline-offset:1px}
input[type=date]{min-height:40px}
.muted{color:var(--soft)}.small{font-size:12.5px;line-height:1.4}.center{text-align:center}.tip{font-size:12.5px;color:var(--soft);margin:-2px 4px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}
.chip{padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:var(--sf);color:var(--soft);font-size:13px;font-weight:600}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.chip.st-ok.on{background:var(--ok);border-color:var(--ok)}.chip.st-huom.on{background:var(--warn);border-color:var(--warn)}.chip.st-korj.on{background:var(--bad);border-color:var(--bad)}.chip.st-et.on{background:#6B7774;border-color:#6B7774}
.chip.verdict-Jatketaan.on{background:var(--ok);border-color:var(--ok)}.chip.verdict-Harkitaan.on{background:var(--warn);border-color:var(--warn)}.chip[class*="verdict-Ei"].on{background:var(--bad);border-color:var(--bad)}
.ph-bar{display:flex;align-items:center;gap:10px;margin-top:8px}
.ph-add{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:18px;background:var(--sf2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--navy2);cursor:pointer}
.ph-add input{display:none}.ph-add.dis{opacity:.5;pointer-events:none}
.ph-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}.ph{display:flex;gap:8px}
.th{position:relative;width:76px;height:76px;flex-shrink:0;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:15px;line-height:24px;padding:0}
.cap{font-size:14px;margin:0}
.link{background:none;border:0;color:var(--navy2);font-weight:700;font-size:13px;padding:8px 0}.link.red,.btn.red{color:var(--bad)}.link.pad{padding:10px 14px}
.add{width:100%;margin-top:12px;padding:11px;border-radius:9px;border:1.5px dashed var(--line);background:transparent;color:var(--navy2);font-weight:700;font-size:13.5px}
.cat{border-top:1px solid var(--line)}
.cat-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px;background:none;border:0;color:var(--ink);text-align:left;font-size:15px}
.cat-n{flex:1;font-weight:600}.cat-c{font-size:12px;color:var(--soft);font-weight:700}.cat-c.done{color:var(--ok)}
.chev{color:var(--soft);font-size:20px;transition:transform .15s}.chev.open{transform:rotate(90deg)}
.cat-b{background:var(--sf2);border-top:1px solid var(--line)}
.li{padding:11px 14px;border-bottom:1px solid var(--line);border-left:4px solid transparent}
.li.t-ok{border-left-color:var(--ok)}.li.t-huom{border-left-color:var(--warn)}.li.t-korj{border-left-color:var(--bad)}.li.t-et{border-left-color:#8A9490}
.li-l{font-weight:600;font-size:14px;margin-bottom:7px}.li .chip{padding:6px 10px;font-size:12.5px}.li textarea{background:var(--sf)}
.hav{border-top:1px solid var(--line);padding:12px 0 8px 10px;border-left:3px solid transparent}.hav.filled{border-left-color:var(--or)}
.hav.sub{margin:10px 0 4px 6px;border-top:1px dashed var(--line);border-left:3px solid var(--line)}.hav.sub.filled{border-left-color:#F0B31C}
.hav-h{display:flex;gap:8px;align-items:center}.hnum{font-family:var(--head);font-weight:800;font-size:16px;color:var(--navy2);min-width:28px}
.ttl{font-weight:600}.del{background:none;border:0;font-size:17px;padding:4px 2px;opacity:.75}
.ehd{margin-top:10px;padding:10px;border-radius:9px;background:var(--sf2);border:1px solid var(--line)}.ehd .lbl:first-child{margin-top:0}.ehd textarea,.ehd input{background:var(--sf)}
.cost{max-width:180px}
.mrow{border:1px solid var(--line);border-radius:9px;padding:9px 10px 10px;margin:10px 0;background:var(--sf2)}.mrow input{background:var(--sf)}
.mrow-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--soft)}
.calc{font-size:13px;font-weight:700;color:var(--navy2);margin-top:8px}.calc:empty{display:none}.calc.warn{color:var(--bad)}
.sig{margin-top:8px}.sig-pad{width:100%;height:150px;border:1px dashed var(--soft);border-radius:9px;background:#fff;touch-action:none;display:block}
.sig-img{width:100%;max-height:150px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:9px;display:block}
.row{display:flex;gap:10px;align-items:center;margin-top:6px}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--line);max-width:680px;margin:0 auto}
.btn{flex:1;padding:13px;border-radius:10px;border:0;font-weight:700;font-size:15px}.btn.primary{background:var(--or);color:#fff}.btn.ghost{background:var(--sf2);color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding:13px 18px}
.btn.sm{flex:0 0 auto;padding:9px 14px;font-size:13.5px}
.intro h2{font-family:var(--head);font-size:24px;margin:6px 4px 4px}.intro p{margin:0 4px 14px;color:var(--soft);font-size:14px}
.choose{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;color:var(--ink)}
.choose .ic{font-size:30px}.choose b{display:block;font-size:17px}.choose small{display:block;color:var(--soft);font-size:13px;margin-top:3px;line-height:1.35}
.lh{font-family:var(--head);font-size:18px;margin:8px 4px 8px}
.rcard{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.rmain{flex:1;cursor:pointer}.rmain b{display:block;font-size:15px}.rmain small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.rdel{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--sf2);color:var(--soft);font-size:18px}
.empty{text-align:center;color:var(--soft);padding:28px 10px;font-size:14px}
.rv-top{margin:-4px 0 6px}.rv-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.doc{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;font-size:14px;line-height:1.5}
.doc h1{font-family:var(--head);font-size:26px;margin:0}.doc h2{margin:10px 0}.dh1{font-family:var(--head);font-size:20px;border-bottom:2px solid var(--navy2);padding-bottom:4px;margin:24px 0 10px!important}
.dh2{font-size:15px;color:var(--navy2);margin:16px 0 6px}.dh3{font-size:14px;margin:12px 0 4px;font-style:italic}.dp{margin:4px 0 8px;white-space:pre-wrap}
.dcover{width:100%;border-radius:8px;margin:6px 0 10px}
.kv,.dt{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 10px}.kv td,.dt td,.dt th{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top;text-align:left}
.kv td:first-child{color:var(--soft);width:40%}.dt th{background:var(--sf2);font-size:11.5px}.dt .foot td{font-weight:700;background:var(--sf2)}.tw{overflow-x:auto}
.s-Korjattava{color:var(--bad);font-weight:700}.s-Huomioitavaa{color:var(--warn);font-weight:700}.s-Kunnossa{color:var(--ok)}
.dverdict{background:var(--navy2);color:#fff;font-weight:700;padding:8px 12px;border-radius:6px;margin:6px 0 10px}
.daction{background:rgba(226,96,12,.1);border-left:3px solid var(--or);padding:8px 10px;margin:8px 0 12px;font-size:13.5px}
.dph{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}.dph figure{margin:0}.dph img{width:100%;border-radius:6px;display:block}.dph figcaption{font-size:11.5px;color:var(--soft);margin-top:3px}
.dsign{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px}.dsign>div:first-child{width:100%}.dsp{flex:1;min-width:140px}.dsp img{width:100%;max-height:70px;object-fit:contain;background:#fff}.dsp .sp{height:60px}.dsp b{display:block;border-top:1px solid var(--ink);padding-top:4px}
.helpdoc h3{font-size:15px;margin:16px 0 4px;color:var(--navy2)}.helpdoc p{margin:0 0 6px}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,14,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:680px;background:var(--sf);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 16px calc(14px + env(safe-area-inset-bottom))}
.sheet h3{font-family:var(--head);font-size:22px;margin:0 0 2px}.fname{margin-bottom:12px;word-break:break-word}
.exp{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.exp>div{flex:1}.exp b{display:block}.exp small{color:var(--soft);font-size:12px}
.sheet-close{width:100%;padding:12px;margin-top:6px;border:0;background:none;color:var(--soft);font-weight:700;font-size:15px}
.ask{font-size:15.5px;line-height:1.5;margin:4px 2px 16px}.ask-btns{display:flex;gap:10px}.ask-btns .btn{flex:1}
.busy{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#14293B;color:#fff;padding:10px 16px;border-radius:20px;font-size:13.5px;font-weight:600;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center;color:#58645F">Ladataan…</p></div>
<script>
/* ===================================================================
   Tarkastusmuistio – ydin: tietomalli, pohjat, raportti, Word ja PDF.
   Ei ulkoisia kirjastoja eikä verkkokutsuja.
   =================================================================== */
var KT = (function(){
  "use strict";

  var APP_NAME = "Tarkastusmuistio";
  var APP_VERSION = "1.0 (15.11.2026)";
  var JSON_FORMAT = "tarkastusmuistio";
  var MAX_PHOTOS = 12;

  /* ---------------- apufunktiot ---------------- */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad2(n){ return String(n).padStart(2, "0"); }
  function todayISO(){ var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function fmtDate(iso){
    if(!iso) return "";
    var p = String(iso).split("-");
    return p.length === 3 ? parseInt(p[2], 10) + "." + parseInt(p[1], 10) + "." + p[0] : iso;
  }
  function num(v){
    if(v === undefined || v === null) return NaN;
    v = String(v).replace(/\s/g, "").replace(",", ".").replace("−", "-");
    return v === "" ? NaN : parseFloat(v);
  }
  function fmt1(x){ return x.toFixed(1).replace(".", ","); }
  function fmtEur(x){
    var s = Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return s + " €";
  }
  /* Vesihöyryn määrä g/m³ lämpötilasta ja suhteellisesta kosteudesta (Magnus) */
  function absHum(t, rh){
    var ps = 6.112 * Math.exp(17.67 * t / (t + 243.5));
    return ps * rh * 2.1674 / (273.15 + t);
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function trim(s){ return (s === undefined || s === null) ? "" : String(s).trim(); }

  /* ---------------- vakiot ---------------- */
  var TILAT = [
    { k: "ok", l: "Kunnossa", short: "OK" },
    { k: "huom", l: "Huomioitavaa", short: "Huom." },
    { k: "korj", l: "Korjattava", short: "Korjattava" },
    { k: "et", l: "Ei tarkastettu", short: "Ei tark." }
  ];
  function tilaLabel(k){ for(var i = 0; i < TILAT.length; i++) if(TILAT[i].k === k) return TILAT[i].l; return ""; }

  /* Mittaustaulukot. Kentän tyyppi: text (oletus), num tai chips. */
  var MEAS = {
    ilma: { name: "Ilman lämpötila ja kosteus", note: "Ulkoilma, asuinhuone ja tilat, joissa tehdään porareikämittauksia. Vesihöyryn määrä lasketaan.",
      fields: [{k:"paikka", l:"Paikka", full:true}, {k:"t", l:"Lämpötila °C", type:"num"}, {k:"rh", l:"RH %", type:"num"}],
      calc: "ah", initial: [{paikka:"Ulkoilma"}, {paikka:"Asuinhuone"}] },
    korkeus: { name: "Korkeuserot", note: "Maanpinnan ja lattian pienin korkeusero sekä puurungon alaosan etäisyys maasta. Alle 15 cm on riski.",
      fields: [{k:"paikka", l:"Kohta", full:true}, {k:"lattia", l:"Maanpinta–lattia cm", type:"num"}, {k:"runko", l:"Puurunko–maa cm", type:"num"}],
      calc: "h15" },
    ryomintatila: { name: "Ryömintätilan korkeus", note: "Matalin korkeus tarkastettavissa olevalla alueella.",
      fields: [{k:"paikka", l:"Kohta", full:true}, {k:"korkeus", l:"Matalin korkeus cm", type:"num", full:true}, {k:"huom", l:"Tarkenne", full:true}] },
    salaoja: { name: "Salaojakaivot", note: "Salaojaputken alareunan syvyys kaivon kannesta noin ±5 cm tarkkuudella.",
      fields: [{k:"kaivo", l:"Kaivo / sijainti", full:true}, {k:"putki", l:"Putken alareuna kannesta cm", type:"num", full:true},
               {k:"liete", l:"Lietettä", type:"chips", opts:["Ei", "Vähän", "Paljon"], full:true}, {k:"kunto", l:"Kaivon kunto", full:true}] },
    porareika: { name: "Porareikä- ja rasiaporamittaukset", note: "Rakenteen kosteus. Vesihöyryn määrä lasketaan.",
      fields: [{k:"menetelma", l:"Menetelmä", type:"chips", opts:["Porareikä", "Rasiapora-avaus"], full:true}, {k:"paikka", l:"Paikka", full:true},
               {k:"rakenne", l:"Rakenne", full:true}, {k:"t", l:"Lämpötila °C", type:"num"}, {k:"rh", l:"RH %", type:"num"},
               {k:"puu", l:"Puun kosteus %", type:"num"}, {k:"huom", l:"Havainto", full:true}],
      calc: "ah", photos: true },
    kallistus: { name: "Märkätilojen kallistukset", note: "Vesivaa'alla tai vettä valuttamalla.",
      fields: [{k:"tila", l:"Tila", full:true}, {k:"tulos", l:"Kallistus kaivoon", type:"chips", opts:["Hyvä", "Riittämätön", "Vastakallistus"], full:true}] },
    vesi: { name: "Käyttövesi", note: "Lämpimän veden lämpötila kauimmaisesta sekoittimesta.",
      fields: [{k:"paikka", l:"Sekoitin / paikka", full:true}, {k:"t", l:"Lämmin vesi °C", type:"num"}, {k:"virtaama", l:"Virtaama", type:"chips", opts:["Ok", "Heikko"]}] },
    kartoitus: { name: "Kosteuskartoitus tiloittain", note: "Pintakosteusosoittimella. Pisteväli ja tulos.",
      fields: [{k:"tila", l:"Tila", full:true}, {k:"vali", l:"Pisteväli", type:"chips", opts:["0,2–0,5 m", "1–3 m"], full:true},
               {k:"tulos", l:"Tulos", type:"chips", opts:["Ei poikkeavaa", "Poikkeava"], full:true}, {k:"huom", l:"Tarkenne", full:true}] },
    iv: { name: "Ilmanvaihdon virtaussuunta", note: "Merkkisavulla tai paperilla venttiileittäin.",
      fields: [{k:"venttiili", l:"Tila / venttiili", full:true}, {k:"suunta", l:"Suunta", type:"chips", opts:["Poisto", "Tulo", "Ei virtausta"], full:true}, {k:"huom", l:"Tarkenne", full:true}] },
    mittari: { name: "Mittarilukemat", note: "Kirjaa lukemat luovutushetkellä. Mittarista voi ottaa kuvan.",
      fields: [{k:"mittari", l:"Mittari", full:true}, {k:"lukema", l:"Lukema", full:true}, {k:"huom", l:"Tarkenne", full:true}],
      initial: [{mittari:"Kylmä vesi"}, {mittari:"Lämmin vesi"}, {mittari:"Sähkö"}], photos: true },
    muut: { name: "Muut mittaukset", note: "Esim. lämmitysverkoston paine tai radonmittauksen tulos.",
      fields: [{k:"mittaus", l:"Mittaus", full:true}, {k:"arvo", l:"Tulos", full:true}] }
  };

  /* Tarkistuslistat: [kategoria, [kohdat]] */
  function mkList(prefix, cats){
    return cats.map(function(c, ci){
      return { id: prefix + ci, name: c[0], items: c[1].map(function(l, ii){ return { id: prefix + ci + "-" + ii, l: l }; }) };
    });
  }
  var LISTS = {
    kunto: mkList("k", [
      ["Perustukset ja sokkeli", ["Sokkeli, halkeamat ja rapautuminen", "Maanpinnan kallistus rakennuksesta poispäin", "Salaojat ja tarkastuskaivot", "Sadevesijärjestelmä (kourut, syöksyt, kaivot)"]],
      ["Julkisivu ja vesikatto", ["Julkisivuverhous ja maalipinnat", "Ikkunat ja ulko-ovet", "Vesikate, pellitykset ja läpiviennit", "Yläpohja ja ullakko (tuuletus, eristeet, jäljet)"]],
      ["Sisätilat", ["Lattiat ja alapohja", "Seinät ja katot", "Kosteus- ja vauriojäljet, hajut"]],
      ["Märkätilat", ["Vedeneristys ja pintamateriaalit", "Lattiakaivot ja kallistukset", "Saunan rakenteet"]],
      ["Talotekniikka", ["Käyttövesi- ja viemäriputket", "Lämmitysjärjestelmä", "Sähköjärjestelmä ja keskus", "Ilmanvaihtolaitteet"]],
      ["Piha ja ulkorakennukset", ["Piharakenteet ja terassit", "Ulkorakennukset ja katokset"]]

  /* ---------------- tietomalli ---------------- */
  function blankPart(){ return { text: "", photos: [], captions: [] }; }
  function blankSub(){ return { id: uid(), title: "", text: "", photos: [], captions: [] }; }
  function blankHav(){ var h = blankSub(); h.ehdotus = ""; h.kiire = ""; h.kustannus = ""; h.sub = []; return h; }
  function fresh(tyyppi, remembered){
    var T = TEMPLATES[tyyppi];
    var insp = { id: uid(), app: JSON_FORMAT, versio: 1, tyyppi: tyyppi, created: Date.now(), meta: {}, cover: blankPart(),
      osat: {}, lista: {}, havainnot: [blankHav()], iv: null, ovi: blankPart(), mittaukset: {}, sign: {} };
    T.meta.forEach(function(f){ insp.meta[f.k] = (f.keep && remembered && remembered[f.k]) || ""; });
    if(insp.meta.pvm === "") insp.meta.pvm = todayISO();
    return normalize(insp);
  }
  function fixPart(p){ p = p || blankPart(); p.text = p.text || ""; p.photos = p.photos || []; p.captions = p.captions || []; return p; }
  function fixSub(s){ fixPart(s); s.id = s.id || uid(); s.title = s.title || ""; return s; }
  function fixHav(h){ var sub = h.sub; fixSub(h); h.ehdotus = h.ehdotus || ""; h.kiire = h.kiire || ""; h.kustannus = h.kustannus || ""; h.sub = (sub || []).map(function(s){ s = fixSub(s); delete s.sub; return s; }); return h; }
  function normalize(i){
    var T = TEMPLATES[i.tyyppi] || TEMPLATES.kunto;
    i.tyyppi = TEMPLATES[i.tyyppi] ? i.tyyppi : "kunto";
    i.meta = i.meta || {};
    T.meta.forEach(function(f){ if(i.meta[f.k] === undefined) i.meta[f.k] = ""; });
    i.cover = fixPart(i.cover);
    i.osat = i.osat || {};
    T.sections.forEach(function(s){
      if(s.type === "text" || s.type === "choice"){ i.osat[s.k] = fixPart(i.osat[s.k]); if(s.type === "choice") i.osat[s.k].valinta = i.osat[s.k].valinta || ""; }
    });
    i.lista = i.lista || {};
    i.havainnot = (i.havainnot || []).map(fixHav);
    if(!i.havainnot.length) i.havainnot.push(blankHav());
    i.iv = fixPart(i.iv);
    ["tyyppi", "peTapa", "peTulos", "peText", "ehdotus", "kiire", "kustannus"].forEach(function(k){ if(i.iv[k] === undefined) i.iv[k] = ""; });
    i.ovi = fixPart(i.ovi);
    i.mittaukset = i.mittaukset || {};
    T.meas.forEach(function(g){ if(!i.mittaukset[g]) i.mittaukset[g] = (MEAS[g].initial || []).map(function(r){ return Object.assign({}, r); }); });
    i.sign = i.sign || {};
    return i;
  }
  function findHav(insp, id){
    for(var a = 0; a < insp.havainnot.length; a++){
      var h = insp.havainnot[a];
      if(h.id === id) return { h: h, list: insp.havainnot, idx: a };
      for(var b = 0; b < h.sub.length; b++) if(h.sub[b].id === id) return { h: h.sub[b], list: h.sub, parent: h, idx: b };
    }
    return null;
  }
  function listItem(insp, id){
    if(!insp.lista[id]) insp.lista[id] = { tila: "", text: "", photos: [], captions: [] };
    return insp.lista[id];
  }
  function filled(p){ return !!(p && ((trim(p.text)) || (p.photos && p.photos.length))); }
  function subFilled(s){ return filled(s) || !!trim(s.title); }
  function ehdFilled(x){ return !!(trim(x.ehdotus) || x.kiire || trim(x.kustannus)); }
  function havFilled(h){ return subFilled(h) || ehdFilled(h) || h.sub.some(subFilled); }
  function ivFilled(i){ var v = i.iv; return filled(v) || !!(v.tyyppi || v.peTapa || trim(v.peTulos) || trim(v.peText)) || ehdFilled(v) || filled(i.ovi); }
  function listItemFilled(it){ return !!(it && (it.tila || filled(it))); }
  function listFilled(insp, listKey){
    return LISTS[listKey].some(function(c){ return c.items.some(function(it){ return listItemFilled(insp.lista[it.id]); }); });
  }
  function signFilled(insp){ return Object.keys(insp.sign).some(function(k){ var s = insp.sign[k]; return s && (s.img || trim(s.name)); }); }
  /* Rivi on tyhjä, jos vain ensimmäinen (paikka-)kenttä on täytetty, kuten valmiiksi annetuissa riveissä */
  function rowEmpty(gid, r){ return MEAS[gid].fields.slice(1).every(function(f){ return !trim(r[f.k]); }) && !(r.photos && r.photos.length); }
  function measFilled(insp){
    var T = TEMPLATES[insp.tyyppi];
    return T.meas.some(function(g){ return (insp.mittaukset[g] || []).some(function(r){ return !rowEmpty(g, r); }); });
  }
  function sectionFilled(insp, s){
    if(s.type === "text") return filled(insp.osat[s.k]);
    if(s.type === "choice") return filled(insp.osat[s.k]) || !!insp.osat[s.k].valinta;
    if(s.type === "checklist") return listFilled(insp, s.list);
    if(s.type === "havainnot") return insp.havainnot.some(havFilled);
    if(s.type === "iv") return ivFilled(insp);
    if(s.type === "sign") return signFilled(insp);
    return false;
  }
  function hasContent(insp){
    var T = TEMPLATES[insp.tyyppi];
    return T.meta.some(function(f){ return f.k !== "pvm" && !f.keep && trim(insp.meta[f.k]); }) || filled(insp.cover) ||
      T.sections.some(function(s){ return sectionFilled(insp, s); }) || measFilled(insp);
  }
  function listStats(insp, cat){
    var done = 0;
    cat.items.forEach(function(it){ var x = insp.lista[it.id]; if(x && x.tila) done++; });
    return { done: done, total: cat.items.length };
  }
  /* Mittausrivin laskettu arvo */
  function measCalc(gid, r){
    var g = MEAS[gid];
    if(g.calc === "ah"){
      var t = num(r.t), rh = num(r.rh);
      if(!isNaN(t) && !isNaN(rh) && rh >= 0 && rh <= 100) return { text: "Vesihöyryä " + fmt1(absHum(t, rh)) + " g/m³", short: fmt1(absHum(t, rh)) };
    }
    if(g.calc === "h15"){
      var a = num(r.lattia), b = num(r.runko), w = [];
      if(!isNaN(a) && a < 15) w.push("maanpinta–lattia alle 15 cm");
      if(!isNaN(b) && b < 15) w.push("puurunko–maa alle 15 cm");
      if(w.length) return { text: "Riski: " + w.join(", "), short: "Alle 15 cm", warn: true };
      if(!isNaN(a) || !isNaN(b)) return { text: "Ei alle 15 cm", short: "OK" };
    }
    return null;
  }

  /* Tiedoston nimi: "Osoite - Kuntotarkastusraportti 2026-11-15" */
  function fileBase(insp){
    var T = TEMPLATES[insp.tyyppi];
    var a = trim(insp.meta.osoite).replace(/[\\\/:*?"<>|]+/g, "").replace(/\s+/g, " ").slice(0, 60) || "Kohde";
    return a + " - " + T.reportTitle + " " + (insp.meta.pvm || todayISO());
  }

  /* ---------------- raportin rakenne (yhteinen Wordille, PDF:lle ja esikatselulle) ---------------- */
  function buildReport(insp){
    insp = normalize(clone(insp));
    var T = TEMPLATES[insp.tyyppi], blocks = [], photoNo = 0, chap = 0;
    var secByKey = {}; T.sections.forEach(function(s){ secByKey[s.k] = s; });
    var m = insp.meta;

    function photos(p, out){
      if(!p.photos.length) return;
      out.push({ t: "photos", items: p.photos.map(function(src, i){ photoNo++; return { src: src, cap: "Kuva " + photoNo + (trim(p.captions[i]) ? ". " + trim(p.captions[i]) : "") }; }) });
    }
    function textPhotos(p, out){ if(trim(p.text)) out.push({ t: "p", text: trim(p.text) }); photos(p, out); }
    function ehdBlock(x, out){
      if(!ehdFilled(x)) return;
      var parts = [];
      if(x.kiire) parts.push(T.kiireLabel + ": " + x.kiire);
      if(T.cost && trim(x.kustannus)) parts.push(T.cost.replace(" €", "") + ": " + trim(x.kustannus) + (/€/.test(x.kustannus) ? "" : " €"));
      out.push({ t: "action", text: trim(x.ehdotus), meta: parts.join(" · ") });
    }
    function chapter(name, body){
      if(!body.length) return;
      chap++;
      blocks.push({ t: "h1", text: chap + ". " + name });
      body.forEach(function(b){ if(b.t === "h2" && b.num) b.text = chap + "." + b.num + " " + b.text; blocks.push(b); });
    }

    /* Toimenpiteet koottuna */
    var actions = [];
    var havNum = {}, havChap = 0;
    function collectHav(){
      var hs = insp.havainnot.filter(havFilled);
      hs.forEach(function(h, a){
        havNum[h.id] = String(a + 1);
        h.sub.filter(subFilled).forEach(function(s, b){ havNum[s.id] = (a + 1) + "." + (b + 1); });
      });
      return hs;
    }
    var havList = collectHav();

    /* Kansilehti */
    var kv = [];
    T.meta.forEach(function(f){
      var v = trim(m[f.k]);
      if(f.type === "date") v = fmtDate(v);
      if(v) kv.push([f.l, v]);
    });
    var subtitle = T.name + (m.laji ? " – " + m.laji : "");
    blocks.push({ t: "cover", title: T.reportTitle, subtitle: subtitle, address: trim(m.osoite), photo: insp.cover.photos[0] || null, kv: kv });
    blocks.push({ t: "toc" });

    /* Luvut */
    var chapterNames = {};
    T.report.forEach(function(key){
      var body = [];
      if(key === "@toimenpiteet"){
        var rows = [], total = 0, hasCost = false;
        var order = {}; T.kiireet.forEach(function(k, i){ order[k] = i; });
        havList.forEach(function(h){
          if(ehdFilled(h)) rows.push({ hav: h.id, title: trim(h.title) || "Havainto", text: trim(h.ehdotus), kiire: h.kiire, cost: trim(h.kustannus) });
        });
        if(T.sections.some(function(s){ return s.type === "iv"; }) && ehdFilled(insp.iv)) rows.push({ kohta: "Ilmanvaihto", text: trim(insp.iv.ehdotus), kiire: insp.iv.kiire, cost: trim(insp.iv.kustannus) });
        T.sections.filter(function(s){ return s.type === "checklist"; }).forEach(function(s){
          LISTS[s.list].forEach(function(c){ c.items.forEach(function(it){
            var x = insp.lista[it.id];
            if(x && x.tila === "korj") rows.push({ kohta: c.name + ": " + it.l, text: trim(x.text) || "Korjattava", kiire: "", cost: "" });
          }); });
        });
        if(!rows.length) return;
        rows.sort(function(a, b){ var oa = a.kiire in order ? order[a.kiire] : 99, ob = b.kiire in order ? order[b.kiire] : 99; return oa - ob; });
        var head = ["Kohta", "Toimenpide", T.kiireLabel], widths = [3, 5, 2];
        if(T.cost){ head.push(T.cost); widths = [3, 4.4, 1.8, 1.8]; }
        var trows = rows.map(function(r){
          var row = [r.hav ? { hav: r.hav, title: r.title } : r.kohta, r.text || "–", r.kiire || "–"];
          if(T.cost){
            var c = num(String(r.cost).replace("€", ""));
            if(!isNaN(c)){ total += c; hasCost = true; row.push(fmtEur(c)); } else row.push(r.cost || "–");
          }
          return row;
        });
        var tb = { t: "table", head: head, rows: trows, widths: widths };
        if(T.cost && hasCost) tb.foot = ["Yhteensä", "", "", fmtEur(total)];
        body.push(tb);
        chapter(T.kiireLabel === "Vastuu" ? "Korjattavat ja korvattavat" : "Toimenpide-ehdotukset", body);
        return;
      }
      if(key === "@mittaukset"){
        T.meas.forEach(function(gid){
          var g = MEAS[gid], rows = (insp.mittaukset[gid] || []).filter(function(r){ return !rowEmpty(gid, r); });
          if(!rows.length) return;
          var head = g.fields.map(function(f){ return f.l; }), widths = g.fields.map(function(f){ return f.full ? 2 : 1; });
          if(g.calc === "ah"){ head.push("Vesihöyry g/m³"); widths.push(1); }
          if(g.calc === "h15"){ head.push("Arvio"); widths.push(1); }
          body.push({ t: "h2", text: g.name });
          body.push({ t: "table", head: head, rows: rows.map(function(r){
            var row = g.fields.map(function(f){ return trim(r[f.k]) || "–"; });
            if(g.calc){ var c = measCalc(gid, r); row.push(c ? c.short : "–"); }
            return row;
          }), widths: widths });
          rows.forEach(function(r){ if(r.photos && r.photos.length) photos(fixPart(r), body); });
        });
        chapter("Mittaukset", body);
        return;
      }
      if(key === "@allekirjoitus"){
        if(!trim(m.tarkastaja)) return;
        blocks.push({ t: "spacer" });
        blocks.push({ t: "sign", place: "", parties: [{ role: [trim(m.tarkastaja), trim(m.patevyys)].filter(Boolean).join(", "), name: trim(m.yritys), img: null }], date: fmtDate(m.pvm) });
        return;
      }
      var s = secByKey[key];
      if(!s || !sectionFilled(insp, s)) return;
      if(s.type === "text"){ textPhotos(insp.osat[s.k], body); chapter(s.name, body); return; }
      if(s.type === "choice"){
        var o = insp.osat[s.k];
        if(o.valinta) body.push({ t: "verdict", text: o.valinta });
        textPhotos(o, body); chapter(s.name, body); return;
      }
      if(s.type === "checklist"){
        LISTS[s.list].forEach(function(c){
          var rows = [], det = [];
          c.items.forEach(function(it){
            var x = insp.lista[it.id];
            if(!listItemFilled(x)) return;
            rows.push([it.l, tilaLabel(x.tila) || "–", trim(x.text) || ""]);
            if(x.photos.length){ det.push({ t: "p", text: it.l, bold: true }); photos(x, det); }
          });
          if(!rows.length) return;
          body.push({ t: "h2", text: c.name });
          body.push({ t: "table", head: ["Kohta", "Tila", "Huomiot"], rows: rows, widths: [3, 1.6, 5], status: 1 });
          det.forEach(function(d){ body.push(d); });
        });
        chapter(s.name, body); return;
      }

        text(ML + CW - pw, ty, pn, size, bold);
        ty += size * 1.6;
      });
      pg = keep;
    }
    /* ylä- ja alatunniste */
    var N = pages.length;
    pages.forEach(function(p, i){
      pg = p;
      if(!p.cover){
        var hdr = rep.header; while(textW(hdr, false, 7.8) > CW - 80 && hdr.length > 5) hdr = hdr.slice(0, -2);
        text(ML, 30, hdr, 7.8, false, SOFT);
        if(rep.date) text(ML + CW - textW(rep.date, false, 7.8), 30, rep.date, 7.8, false, SOFT);
        line(ML, 42, ML + CW, 42);
      }
      var ft = "Sivu " + (i + 1) + " / " + N; text((PW - textW(ft, false, 7.8)) / 2, PH - 34, ft, 7.8, false, SOFT);
    });

    /* kokoaminen */
    var chunks = [], offsets = [], pos = 0, objCount = 0;
    function addRaw(u8){ chunks.push(u8); pos += u8.length; }
    function latin(s){ var u = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; }
    function obj(n, body, stream){
      offsets[n] = pos;
      addRaw(latin(n + " 0 obj\n" + body + (stream ? "\nstream\n" : "\nendobj\n")));
      if(stream){ addRaw(stream); addRaw(latin("\nendstream\nendobj\n")); }
    }
    var nFontBase = 3, nImgBase = 6, nPageBase = nImgBase + images.length;
    objCount = nPageBase + pages.length * 2 - 1;
    addRaw(latin("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"));
    obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
    var kids = pages.map(function(_, i){ return (nPageBase + i * 2 + 1) + " 0 R"; }).join(" ");
    obj(2, "<< /Type /Pages /Kids [" + kids + "] /Count " + pages.length + " >>");
    obj(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    obj(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    obj(5, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>");
    var xobj = images.map(function(im, i){ return "/" + im.name + " " + (nImgBase + i) + " 0 R"; }).join(" ");
    images.forEach(function(im, i){
      var cs = im.comps === 1 ? "/DeviceGray" : im.comps === 4 ? "/DeviceCMYK /Decode [1 0 1 0 1 0 1 0]" : "/DeviceRGB";
      obj(nImgBase + i, "<< /Type /XObject /Subtype /Image /Width " + im.w + " /Height " + im.h + " /ColorSpace " + cs + " /BitsPerComponent 8 /Filter /DCTDecode /Length " + im.bytes.length + " >>", im.bytes);
    });
    var res = "<< /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >>" + (xobj ? " /XObject << " + xobj + " >>" : "") + " >>";
    pages.forEach(function(p, i){
      var content = latin(p.ops.join("\n"));
      obj(nPageBase + i * 2, "<< /Length " + content.length + " >>", content);
      obj(nPageBase + i * 2 + 1, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources " + res + " /Contents " + (nPageBase + i * 2) + " 0 R >>");
    });
    var infoN = objCount + 1;
    obj(infoN, "<< /Title " + pdfStr(rep.title + (rep.address ? " - " + rep.address : "")) + " /Producer (" + APP_NAME + ") >>");
    var xref = pos, x = "xref\n0 " + (infoN + 1) + "\n0000000000 65535 f \n";
    for(var k = 1; k <= infoN; k++) x += String(offsets[k] || 0).padStart(10, "0") + " 00000 n \n";
    x += "trailer\n<< /Size " + (infoN + 1) + " /Root 1 0 R /Info " + infoN + " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
    addRaw(latin(x));
    return concat(chunks);
  }

  /* ---------------- JSON-varmuuskopio ---------------- */
  function exportJson(insp){
    var m = clone(insp); delete m.savedAt;
    return { muoto: JSON_FORMAT, versio: 1, sovellus: APP_VERSION, viety: new Date().toISOString(), tarkastus: m };
  }
  /* Tuonti: oma muoto sekä alkuperäisen Kuntotarkastusmuistion (kmu-muistio) tallennus */
  function importJson(d){
    if(d && d.muoto === JSON_FORMAT && d.tarkastus) return normalize(d.tarkastus);
    if(d && d.muoto === "kmu-muistio" && d.muistio){
      var k = d.muistio, o = k.osat || {};
      var insp = { id: k.id || uid(), app: JSON_FORMAT, versio: 1, tyyppi: "kunto", meta: k.meta || {},
        cover: { photos: k.coverPhotos || [], captions: k.coverCaptions || [] },
        osat: { lahto: o.lahto, asiak: o.asiak, lasna: o.lasna, rajaus: o.rajaus, yhteenveto: o.yhteenveto },
        iv: o.iv, ovi: o.ovi, havainnot: k.havainnot || [], mittaukset: k.mittaukset || {}, lista: {}, sign: {} };
      return normalize(insp);
    }
    throw new Error("Tiedosto ei ole Tarkastusmuistion varmuuskopio.");
  }

  return {
    APP_NAME: APP_NAME, APP_VERSION: APP_VERSION, MAX_PHOTOS: MAX_PHOTOS, TEMPLATES: TEMPLATES, LISTS: LISTS, MEAS: MEAS, TILAT: TILAT,
    IV_TYYPIT: IV_TYYPIT, PE_TAVAT: PE_TAVAT,
    uid: uid, todayISO: todayISO, fmtDate: fmtDate, num: num, clone: clone, trim: trim,
    fresh: fresh, normalize: normalize, blankHav: blankHav, blankSub: blankSub, findHav: findHav, listItem: listItem,
    filled: filled, havFilled: havFilled, subFilled: subFilled, sectionFilled: sectionFilled, hasContent: hasContent, listStats: listStats,
    measCalc: measCalc, rowEmpty: rowEmpty, fileBase: fileBase,
    buildReport: buildReport, buildDocx: buildDocx, buildPdf: buildPdf, exportJson: exportJson, importJson: importJson,
    dataUrlInfo: dataUrlInfo
  };
})();
if(typeof module !== "undefined") module.exports = KT;

</script>
<script>
/* ===================================================================
   Tarkastusmuistio – käyttöliittymä ja tallennus laitteen omaan muistiin
   =================================================================== */
(function(){
  "use strict";
  var T = KT.TEMPLATES;

  /* ---------------- tallennus: IndexedDB, varalla localStorage ---------------- */
  var DB_NAME = "tarkastusmuistio", idb = null;
  function idbOpen(){
    return new Promise(function(res){
      try {
        if(!window.indexedDB) return res(null);
        var rq = indexedDB.open(DB_NAME, 1);
        rq.onupgradeneeded = function(){ rq.result.createObjectStore("kv"); };
        rq.onsuccess = function(){ res(rq.result); };
        rq.onerror = function(){ res(null); };
      } catch(e){ res(null); }
    });
  }
  function dbGet(key){
    if(!idb){ try { var r = localStorage.getItem("tm_" + key); return Promise.resolve(r ? JSON.parse(r) : null); } catch(e){ return Promise.resolve(null); } }
    return new Promise(function(res){
      try { var rq = idb.transaction("kv", "readonly").objectStore("kv").get(key); rq.onsuccess = function(){ res(rq.result === undefined ? null : rq.result); }; rq.onerror = function(){ res(null); }; }
      catch(e){ res(null); }
    });
  }
  var warned = false;
  function storageFail(e){
    console.error(e);
    if(warned) return; warned = true;
    notify("Tallennus laitteen muistiin epäonnistui (muisti voi olla täynnä). Älä sulje sovellusta: vie tarkastus heti talteen Raportit-välilehdeltä.");
  }
  function dbSet(key, val){
    if(!idb){ try { localStorage.setItem("tm_" + key, JSON.stringify(val)); return Promise.resolve(true); } catch(e){ storageFail(e); return Promise.resolve(false); } }
    return new Promise(function(res){
      try {
        var tx = idb.transaction("kv", "readwrite");
        tx.objectStore("kv").put(val === null ? null : JSON.parse(JSON.stringify(val)), key);
        tx.oncomplete = function(){ res(true); };
        tx.onerror = tx.onabort = function(){ storageFail(tx.error); res(false); };
      } catch(e){ storageFail(e); res(false); }
    });
  }

  var state = { cur: null, history: [], remembered: {}, tab: "tarkastus", view: null, open: {}, more: {} };
  var timer = null;
  function saveCur(){ clearTimeout(timer); timer = null; return dbSet("current", state.cur); }
  function saveSoon(){ clearTimeout(timer); timer = setTimeout(saveCur, 400); }
  function flush(){ if(timer) saveCur(); }
  function saveHistory(){ return dbSet("history", state.history); }
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") flush(); });
  window.addEventListener("pagehide", flush);

  /* ---------------- apurit ---------------- */
  function esc(s){ return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function tpl(){ return T[state.cur.tyyppi]; }
  function getObj(path){
    var a = path.split("/"), o, rest;
    if(a[0] === "hav"){ var f = KT.findHav(state.cur, a[1]); o = f && f.h; rest = a.slice(2); }
    else if(a[0] === "lista"){ o = KT.listItem(state.cur, a[1]); rest = a.slice(2); }
    else if(a[0] === "mitt"){ o = state.cur.mittaukset[a[1]][parseInt(a[2], 10)]; if(o){ o.photos = o.photos || []; o.captions = o.captions || []; } rest = a.slice(3); }
    else if(a[0] === "sign"){ o = state.cur.sign[a[1]] || (state.cur.sign[a[1]] = { name: "", img: null }); rest = a.slice(2); }
    else { o = state.cur; rest = a; }
    for(var i = 0; i < rest.length && o; i++) o = o[rest[i]];
    return o;
  }
  function ref(path){ var i = path.lastIndexOf("/"); return { o: getObj(path.slice(0, i)), k: path.slice(i + 1) }; }
  function busy(msg){
    var b = document.getElementById("busy");
    if(!msg){ if(b) b.remove(); return; }
    if(!b){ b = document.createElement("div"); b.id = "busy"; b.className = "busy"; document.body.appendChild(b); }
    b.textContent = msg;
  }
  /* Omat dialogit (selaimen alert/confirm eivät toimi kaikissa näkymissä) */
  function ask(msg, yes, no){
    return new Promise(function(res){
      closeSheet();
      var h = '<div class="sheet-bg" id="sheet"><div class="sheet"><div class="ask">' + esc(msg).replace(/\n/g, "<br>") + '</div><div class="ask-btns">' +
        (no === null ? "" : '<button class="btn ghost" data-r="0">' + esc(no || "Peruuta") + '</button>') + '<button class="btn primary" data-r="1">' + esc(yes || "OK") + "</button></div></div></div>";
      document.body.insertAdjacentHTML("beforeend", h);
      var el = document.getElementById("sheet");
      el.addEventListener("click", function(e){
        var b = e.target.closest("[data-r]");
        if(b || (e.target === el && no !== null)){ closeSheet(); res(!!(b && b.getAttribute("data-r") === "1")); }
      });
    });
  }
  function notify(msg){ return ask(msg, "OK", null); }
  function toast(msg){ busy(msg); setTimeout(function(){ busy(null); }, 2600); }

  /* ---------------- näkymät ---------------- */
  var app = document.getElementById("app");
  function render(){
    var y = window.scrollY;
    var h = topbar() + '<main id="main">';
    if(state.tab === "ohje") h += renderHelp();
    else if(state.tab === "raportit") h += renderReports();
    else if(!state.cur) h += renderChooser();
    else if(state.tab === "mittaukset") h += renderMeas();
    else h += renderInspection();
    h += "</main>";
    if(state.cur && (state.tab === "tarkastus" || state.tab === "mittaukset"))
      h += '<div class="bottombar"><button class="btn primary" data-a="save">Tallenna raportti</button><button class="btn ghost" data-a="new">Uusi</button></div>';
    app.innerHTML = h;
    initSignatures();
    window.scrollTo(0, y);
  }
  function topbar(){
    var c = state.cur, t = c ? T[c.tyyppi] : null;
    var h = '<header class="top"><div class="top-in"><div class="brand-row"><div class="brand">TARKASTUS<span>MUISTIO</span></div>' +
      '<button class="help" data-a="tab" data-v="ohje">Ohje</button></div>';
    if(c) h += '<div class="addr"><span class="badge">' + t.icon + " " + esc(t.name) + '</span> <span id="top-addr">' + esc(c.meta.osoite || "Osoite puuttuu") + "</span></div>";
    h += '</div><nav class="tabs">';
    [["tarkastus", "Tarkastus"], ["mittaukset", "Mittaukset"], ["raportit", "Raportit" + (state.history.length ? " (" + state.history.length + ")" : "")]].forEach(function(x){
      if(x[0] === "mittaukset" && !c) return;
      h += '<button class="tab' + (state.tab === x[0] ? " on" : "") + '" data-a="tab" data-v="' + x[0] + '">' + x[1] + "</button>";
    });
    return h + "</nav></header>";
  }
  function renderChooser(){
    var h = '<div class="intro"><h2>Aloita uusi tarkastus</h2><p>Valitse tarkastuksen tyyppi. Kaikki tiedot ja kuvat tallentuvat vain tähän laitteeseen.</p></div>';
    Object.keys(T).forEach(function(k){
      h += '<button class="choose" data-a="pick" data-v="' + k + '"><span class="ic">' + T[k].icon + '</span><span><b>' + esc(T[k].name) + "</b><small>" + esc(T[k].desc) + "</small></span></button>";
    });
    return h + '<p class="muted center">Varmuuskopion (.json) voi tuoda Raportit-välilehdeltä.</p>';
  }
  function field(path, f, val){
    var full = f.full ? " full" : "", h = '<div class="fi' + full + '"><label>' + esc(f.l) + "</label>";
    if(f.type === "chips") h += chips(path, f.opts, val);
    else if(f.type === "date") h += '<input type="date" data-p="' + path + '" value="' + esc(val) + '">';
    else if(f.type === "num") h += '<input inputmode="decimal" data-p="' + path + '" value="' + esc(val) + '" placeholder="' + esc(f.ph || "") + '">';
    else h += '<input data-p="' + path + '" value="' + esc(val) + '" placeholder="' + esc(f.ph || "") + '"' + (f.keep ? ' data-keep="' + f.k + '"' : "") + ">";
    return h + "</div>";
  }
  function chips(path, opts, val, cls){
    return '<div class="chips">' + opts.map(function(o){
      var v = typeof o === "string" ? o : o.k, l = typeof o === "string" ? o : o.l;
      return '<button class="chip' + (cls ? " " + cls + "-" + v : "") + (val === v ? " on" : "") + '" data-chip="' + path + '" data-v="' + esc(v) + '">' + esc(l) + "</button>";
    }).join("") + "</div>";
  }
  function textarea(path, val, ph, rows){ return '<textarea data-p="' + path + '" rows="' + (rows || 3) + '" placeholder="' + esc(ph || "") + '">' + esc(val) + "</textarea>"; }
  function photos(path, obj){
    var n = obj.photos.length, full = n >= KT.MAX_PHOTOS;
    var h = '<div class="ph-bar"><label class="ph-add' + (full ? " dis" : "") + '">📷 ' + (full ? "Enintään " + KT.MAX_PHOTOS + " kuvaa" : "Lisää kuvia") +
      '<input type="file" accept="image/*" multiple data-photos="' + path + '"' + (full ? " disabled" : "") + "></label>" + (n ? '<span class="muted">' + n + " / " + KT.MAX_PHOTOS + "</span>" : "") + "</div>";
    if(n){
      h += '<div class="ph-list">';
      obj.photos.forEach(function(src, i){
        h += '<div class="ph"><div class="th"><img src="' + src + '" alt=""><button class="x" data-delphoto="' + path + '" data-i="' + i + '" aria-label="Poista kuva">×</button></div>' +
          '<textarea class="cap" data-p="' + path + "/captions/" + i + '" rows="2" placeholder="Kuvateksti">' + esc(obj.captions[i] || "") + "</textarea></div>";
      });
      h += "</div>";
    }
    return h;
  }
  function ehdBox(path, x){
    var t = tpl();
    var h = '<div class="ehd"><label class="lbl">Toimenpide-ehdotus</label>' + textarea(path + "/ehdotus", x.ehdotus, "Mitä pitäisi tehdä", 2) +
      '<label class="lbl">' + esc(t.kiireLabel) + "</label>" + chips(path + "/kiire", t.kiireet, x.kiire);
    if(t.cost) h += '<label class="lbl">' + esc(t.cost) + '</label><input inputmode="decimal" class="cost" data-p="' + path + '/kustannus" value="' + esc(x.kustannus) + '" placeholder="esim. 1500">';
    return h + "</div>";
  }
  function secHead(n, name){ return '<div class="sh"><span class="num">' + n + "</span><h3>" + esc(name) + "</h3></div>"; }

  function renderInspection(){
    var c = state.cur, t = tpl(), h = "";
    h += '<section class="card">' + secHead("", "Perustiedot") + '<div class="grid">';
    t.meta.forEach(function(f){ h += field("meta/" + f.k, f, c.meta[f.k]); });
    h += '</div><label class="lbl">Yleiskuvat – ensimmäinen tulee kansilehdelle</label>' + photos("cover", c.cover) + "</section>";
    h += '<p class="tip">🎤 Vinkki: sanele tekstit puhelimen näppäimistön mikrofonilla.</p>';
    t.sections.forEach(function(s, si){
      var n = String(si + 1);
      if(s.type === "text"){
        h += '<section class="card">' + secHead(n, s.name) + textarea("osat/" + s.k + "/text", c.osat[s.k].text, s.ph, 4) + (s.photos ? photos("osat/" + s.k, c.osat[s.k]) : "") + "</section>";
      } else if(s.type === "choice"){
        h += '<section class="card">' + secHead(n, s.name) + chips("osat/" + s.k + "/valinta", s.opts, c.osat[s.k].valinta, "verdict") + textarea("osat/" + s.k + "/text", c.osat[s.k].text, s.ph, 4) + "</section>";
      } else if(s.type === "checklist"){
        h += '<section class="card nopad"><div class="padx">' + secHead(n, s.name) + '<p class="muted small">Merkitse tila. Korjattavat kohdat tulevat raportin toimenpidetaulukkoon.</p></div>';
        KT.LISTS[s.list].forEach(function(cat){
          var st = KT.listStats(c, cat), open = !!state.open[cat.id];
          h += '<div class="cat"><button class="cat-h" data-a="cat" data-v="' + cat.id + '"><span class="cat-n">' + esc(cat.name) + '</span><span class="cat-c' + (st.done === st.total ? " done" : "") + '">' + st.done + "/" + st.total + '</span><span class="chev' + (open ? " open" : "") + '">›</span></button>';
          if(open){
            h += '<div class="cat-b">';
            cat.items.forEach(function(it){
              var x = c.lista[it.id] || { tila: "", text: "", photos: [] };
              var show = state.more[it.id] || (x.tila && x.tila !== "ok") || KT.filled(x);
              h += '<div class="li' + (x.tila ? " t-" + x.tila : "") + '"><div class="li-l">' + esc(it.l) + "</div>" + chips("lista/" + it.id + "/tila", KT.TILAT.map(function(q){ return { k: q.k, l: q.short }; }), x.tila, "st");
              if(show){ KT.listItem(c, it.id); h += textarea("lista/" + it.id + "/text", x.text, "Huomiot", 2) + photos("lista/" + it.id, c.lista[it.id]); }
              else h += '<button class="link" data-a="more" data-v="' + it.id + '">+ huomio tai kuva</button>';
              h += "</div>";
            });
            if(st.done < st.total) h += '<button class="link pad" data-a="allok" data-v="' + cat.id + '">✓ Merkitse loput kunnossa</button>';
            h += "</div>";
          }
          h += "</div>";
        });
        h += "</section>";
      } else if(s.type === "havainnot"){
        h += '<section class="card">' + secHead(n, s.name);
        c.havainnot.forEach(function(hv, a){
          h += havHtml(hv, n + "." + (a + 1), false, c.havainnot.length);
        });
        h += '<button class="add" data-a="addhav">+ Lisää havainto</button></section>';
      } else if(s.type === "iv"){
        var v = c.iv;
        h += '<section class="card">' + secHead(n, s.name) + '<label class="lbl">Järjestelmä</label>' + chips("iv/tyyppi", KT.IV_TYYPIT, v.tyyppi) +
          '<label class="lbl">Paine-ero</label>' + chips("iv/peTapa", KT.PE_TAVAT, v.peTapa) +
          '<div class="grid"><div class="fi"><label>Tulos</label><input data-p="iv/peTulos" value="' + esc(v.peTulos) + '" placeholder="esim. −5 Pa"></div></div>' +
          textarea("iv/peText", v.peText, "Paine-eron selostus", 2) + '<label class="lbl">Havainnot ilmanvaihdosta</label>' + textarea("iv/text", v.text, "Venttiilit, kanavat, kone…", 3) + photos("iv", v) +
          '<label class="lbl">Oviraot</label>' + textarea("ovi/text", c.ovi.text, "Oviraot ja korvausilma", 2) + photos("ovi", c.ovi) + ehdBox("iv", v) + "</section>";
      } else if(s.type === "sign"){
        h += '<section class="card">' + secHead(n, s.name) + '<div class="grid"><div class="fi full"><label>Paikka</label><input data-p="sign/_place/name" value="' + esc((c.sign._place || {}).name || "") + '" placeholder="esim. Lahti"></div></div>';
        s.roles.forEach(function(r){
          var x = c.sign[r[0]] || {};
          h += '<div class="sig"><label class="lbl">' + esc(r[1]) + "</label>" +
            (x.img ? '<img class="sig-img" src="' + x.img + '" alt="Allekirjoitus">' : '<canvas class="sig-pad" data-sig="' + r[0] + '"></canvas><div class="muted small">Allekirjoita sormella yllä olevaan kenttään.</div>') +
            '<div class="row"><input data-p="sign/' + r[0] + '/name" value="' + esc(x.name || "") + '" placeholder="Nimenselvennys"><button class="link" data-a="clearsig" data-v="' + r[0] + '">Tyhjennä</button></div></div>';
        });
        h += "</section>";
      }
    });
    return h;
  }
  function havHtml(hv, numTxt, isSub, count){
    var p = "hav/" + hv.id, filled = isSub ? KT.subFilled(hv) : KT.havFilled(hv);
    var h = '<div class="hav' + (isSub ? " sub" : "") + (filled ? " filled" : "") + '"><div class="hav-h"><span class="hnum">' + numTxt + "</span>" +
      '<input class="ttl" data-p="' + p + '/title" value="' + esc(hv.title) + '" placeholder="' + (isSub ? "Tarkennus, esim. Pintakosteus" : "Otsikko, esim. Makuuhuone") + '" data-title="' + hv.id + '">' +
      ((count > 1 || isSub) ? '<button class="del" data-a="delhav" data-v="' + hv.id + '" aria-label="Poista">🗑</button>' : "") + "</div>" +
      textarea(p + "/text", hv.text, "Havainto", 3) + photos(p, hv);
    if(!isSub){
      hv.sub.forEach(function(sb, b){ h += havHtml(sb, numTxt + "." + (b + 1), true); });
      h += '<button class="link" data-a="addsub" data-v="' + hv.id + '">+ Lisää alahavainto</button>' + ehdBox(p, hv);
    }
    return h + "</div>";

  /* ---------------- toiminnot ---------------- */
  function findHist(id){ for(var i = 0; i < state.history.length; i++) if(state.history[i].id === id) return state.history[i]; return null; }
  function rememberKeep(){
    var t = tpl(), changed = false;
    t.meta.forEach(function(f){ if(f.keep && state.remembered[f.k] !== state.cur.meta[f.k]){ state.remembered[f.k] = state.cur.meta[f.k]; changed = true; } });
    if(changed) dbSet("remembered", state.remembered);
  }
  function startNew(type){
    state.cur = KT.fresh(type, state.remembered);
    state.open = {}; state.more = {}; state.tab = "tarkastus";
    saveCur(); render(); window.scrollTo(0, 0);
  }
  function saveReport(){
    flush();
    if(!KT.hasContent(state.cur)){ notify("Tarkastuksessa ei ole vielä sisältöä."); return; }
    var copy = KT.clone(state.cur); copy.savedAt = Date.now();
    var idx = -1; state.history.forEach(function(h, i){ if(h.id === copy.id) idx = i; });
    if(idx > -1) state.history[idx] = copy; else state.history.push(copy);
    saveHistory().then(function(ok){ render(); openExport(copy, ok ? "Raportti tallennettu" : "Tallennus epäonnistui – vie tiedosto nyt"); });
  }
  function canShareFiles(){
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File(["x"], "x.pdf", { type: "application/pdf" })] })); } catch(e){ return false; }
  }
  function makeFile(insp, fmt){
    var rep = KT.buildReport(insp), data, mime, ext;
    if(fmt === "pdf"){ data = KT.buildPdf(rep); mime = "application/pdf"; ext = ".pdf"; }
    else if(fmt === "docx"){ data = KT.buildDocx(rep); mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"; ext = ".docx"; }
    else { data = JSON.stringify(KT.exportJson(insp)); mime = "application/json"; ext = ".json"; }
    return { blob: new Blob([data], { type: mime }), name: rep.filename + ext, mime: mime };
  }
  /* Claude-artefaktina ajettaessa lataukset kulkevat alustan oman latausikkunan kautta */
  var dlCap = null;
  try { if(window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(function(n){ dlCap = n; }).catch(function(){}); } catch(e){}
  function download(f){
    if(dlCap){
      dlCap.save({ filename: f.name, data: f.blob }).then(function(){ toast("Tallennettu: " + f.name); })
        .catch(function(e){ if(!e || e.code !== "declined") notify("Tiedostoa ei voitu tallentaa tässä näkymässä (" + ((e && e.code) || "virhe") + ")."); });
      return;
    }
    var url = URL.createObjectURL(f.blob), a = document.createElement("a");
    a.href = url; a.download = f.name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
    toast("Tallennettu: " + f.name);
  }
  function deliver(insp, fmt, mode){
    busy("Tehdään tiedostoa…");
    setTimeout(function(){
      var f;
      try { f = makeFile(insp, fmt); } catch(e){ console.error(e); busy(null); notify("Tiedoston teko epäonnistui: " + e.message); return; }
      busy(null);
      if(mode === "share" && canShareFiles()){
        var file = new File([f.blob], f.name, { type: f.mime });
        navigator.share({ files: [file], title: f.name }).catch(function(e){ if(e && e.name !== "AbortError") download(f); });
      } else download(f);
    }, 30);
  }
  function openExport(insp, title){
    closeSheet();
    var share = canShareFiles(), name = KT.fileBase(insp);
    var rows = [["pdf", "PDF", "Valmis luettavaksi ja lähetettäväksi"], ["docx", "Word (.docx)", "Muokattava raporttiluonnos"], ["json", "Varmuuskopio (.json)", "Kaikki tiedot ja kuvat – voi tuoda takaisin"]];
    var h = '<div class="sheet-bg" id="sheet"><div class="sheet"><h3>' + esc(title || "Vie raportti") + '</h3><div class="muted small fname">' + esc(name) + "</div>";
    rows.forEach(function(r){
      h += '<div class="exp"><div><b>' + r[1] + "</b><small>" + r[2] + "</small></div>" +
        (share ? '<button class="btn sm primary" data-x="share" data-f="' + r[0] + '">Jaa</button>' : "") +
        '<button class="btn sm ' + (share ? "ghost" : "primary") + '" data-x="dl" data-f="' + r[0] + '">Lataa</button></div>';
    });
    h += '<button class="sheet-close" data-x="close">Sulje</button></div></div>';
    document.body.insertAdjacentHTML("beforeend", h);
    var el = document.getElementById("sheet");
    el.addEventListener("click", function(e){
      var b = e.target.closest("[data-x]");
      if(e.target === el || (b && b.getAttribute("data-x") === "close")){ closeSheet(); return; }
      if(b) deliver(insp, b.getAttribute("data-f"), b.getAttribute("data-x") === "share" ? "share" : "dl");
    });
  }
  function closeSheet(){ var s = document.getElementById("sheet"); if(s) s.remove(); }
  function readPhoto(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function(){
        var max = 1600, s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
        var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.8));
      };
      im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("Kuvaa ei voitu lukea")); };
      im.src = url;
    });
  }
  function addPhotos(path, files){
    var obj = getObj(path); if(!obj) return;
    var room = KT.MAX_PHOTOS - obj.photos.length, list = Array.prototype.slice.call(files, 0, Math.max(0, room)), skipped = files.length - list.length, fail = 0;
    busy("Lisätään kuvia…");
    var chain = Promise.resolve();
    list.forEach(function(f){ chain = chain.then(function(){ return readPhoto(f).then(function(d){ obj.photos.push(d); obj.captions.push(""); }).catch(function(){ fail++; }); }); });
    chain.then(function(){
      busy(null); saveCur(); render();
      if(skipped > 0) notify(skipped + " kuvaa jätettiin pois: kohtaan mahtuu enintään " + KT.MAX_PHOTOS + " kuvaa.");
      if(fail) notify(fail + " kuvaa ei voitu lukea.");
    });
  }
  function importFile(file){
    var rd = new FileReader();
    rd.onload = async function(){
      try {
        var insp = KT.importJson(JSON.parse(rd.result));
        var ex = findHist(insp.id);
        if(ex && !(await ask("Raportti \"" + (insp.meta.osoite || "") + "\" on jo listassa. Korvataanko se?", "Korvaa", "Tuo kopiona"))) insp.id = KT.uid();
        insp.savedAt = Date.now();
        state.history = state.history.filter(function(h){ return h.id !== insp.id; }).concat([insp]);
        saveHistory().then(function(){ render(); toast("Tuotu: " + (insp.meta.osoite || "raportti")); });
      } catch(e){ notify(e.message || "Tiedostoa ei voitu lukea."); }
    };
    rd.readAsText(file);
  }

  /* ---------------- allekirjoitus sormella ---------------- */
  function initSignatures(){
    app.querySelectorAll("canvas[data-sig]").forEach(function(cv){
      var role = cv.getAttribute("data-sig"), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      var g = cv.getContext("2d"); g.scale(dpr, dpr); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
      g.lineWidth = 2.2; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#111";
      var drawing = false, drew = false;
      function pt(e){ var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
      cv.addEventListener("pointerdown", function(e){ drawing = true; cv.setPointerCapture(e.pointerId); var p = pt(e); g.beginPath(); g.moveTo(p[0], p[1]); e.preventDefault(); });
      cv.addEventListener("pointermove", function(e){ if(!drawing) return; var p = pt(e); g.lineTo(p[0], p[1]); g.stroke(); drew = true; e.preventDefault(); });
      function end(){
        if(!drawing) return; drawing = false;
        if(!drew) return;
        var s = state.cur.sign[role] || (state.cur.sign[role] = { name: "", img: null });
        s.img = cv.toDataURL("image/jpeg", 0.85);
        saveSoon();
      }
      cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end); cv.addEventListener("pointerleave", end);
    });
  }
  /* ---------------- tapahtumat ---------------- */

  app.addEventListener("click", async function(e){

      var r = ref(chip.getAttribute("data-chip")), v = chip.getAttribute("data-v");

      var o = getObj(del.getAttribute("data-delphoto")), i = +del.getAttribute("data-i");

    }
    var b = e.target.closest("[data-a]"); if(!b) return;
    var a = b.getAttribute("data-a"), v = b.getAttribute("data-v");
    if(a === "tab"){ flush(); state.tab = v; state.view = null; render(); window.scrollTo(0, 0); }
    else if(a === "pick") startNew(v);
    else if(a === "new"){
      flush();
      var saved = findHist(state.cur.id);
      var unsaved = KT.hasContent(state.cur) && (!saved || JSON.stringify(Object.assign({}, saved, { savedAt: 0 })) !== JSON.stringify(Object.assign({}, state.cur, { savedAt: 0 })));
      if(unsaved && !(await ask("Aloitetaanko uusi tarkastus?\n\nKesken olevaa ei ole tallennettu raportiksi, ja se poistuu.", "Aloita uusi"))) return;
      state.cur = null; dbSet("current", null); state.tab = "tarkastus"; render(); window.scrollTo(0, 0);
    }
    else if(a === "save") saveReport();
    else if(a === "cat"){ state.open[v] = !state.open[v]; render(); }

    else if(a === "export"){ flush(); openExport(v === "cur" ? state.cur : findHist(v)); }
    else if(a === "openrep"){ state.view = v; render(); window.scrollTo(0, 0); }
    else if(a === "back"){ state.view = null; render(); }
    else if(a === "edit"){
      var rp = findHist(v); if(!rp) return;
      if(state.cur && state.cur.id !== rp.id && KT.hasContent(state.cur) && !findHist(state.cur.id) &&
         !(await ask("Kesken olevaa tarkastusta ei ole tallennettu raportiksi. Korvataanko se tällä raportilla?", "Korvaa"))) return;
      state.cur = KT.normalize(KT.clone(rp)); delete state.cur.savedAt;
      saveCur(); state.view = null; state.tab = "tarkastus"; render(); window.scrollTo(0, 0);
    }
    else if(a === "delrep"){
      var rr = findHist(v); if(!rr) return;
      if(!(await ask("Poistetaanko raportti \"" + (rr.meta.osoite || "") + "\" pysyvästi?", "Poista"))) return;
      state.history = state.history.filter(function(x){ return x.id !== v; }); state.view = null; saveHistory(); render();
    }
  });
  function focusTitle(id){ var el = app.querySelector('[data-title="' + id + '"]'); if(el){ el.focus(); el.scrollIntoView({ block: "center" }); } }

  /* ---------------- käynnistys ---------------- */
  idbOpen().then(function(db){
    idb = db;
    return Promise.all([dbGet("current"), dbGet("history"), dbGet("remembered")]);
  }).then(function(v){
    state.cur = v[0] ? KT.normalize(v[0]) : null;
    state.history = (v[1] || []).map(KT.normalize);
    state.remembered = v[2] || {};
    render();
  });
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  try {
    if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && window.self === window.top)
      navigator.serviceWorker.register("sw.js").catch(function(){});
  } catch(e){}
})();

</script>
</body>
</html>
